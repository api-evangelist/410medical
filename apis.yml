aid: 410medical
name: 410 Medical
description: >-
  410 Medical, Inc. is a privately held medical device company headquartered in Durham,
  North Carolina, founded in 2013 by pediatric intensivist Dr. Mark Piehl and named for the
  pediatric septic shock guideline of four 10 ml/kg fluid boluses. It designs, engineers and
  assembles the LifeFlow family of handheld rapid infusers — LifeFlow for crystalloid
  resuscitation and LifeFlow PLUS for blood and blood components — which let a single
  clinician deliver a unit of blood or 500 ml of fluid in under two minutes without a pump or
  pressure bag. LifeFlow received FDA clearance in 2016 and is used by hospital emergency
  departments, trauma centers, pediatric and obstetric units, EMS agencies, fire departments
  and military and public safety teams for sepsis, trauma, hemorrhagic shock and postpartum
  hemorrhage. 410 Medical is a physical medical device manufacturer: it publishes no public
  API, developer portal, SDK, OpenAPI or any other machine-readable specification, and its
  entire web surface is a WordPress marketing, clinical-evidence and training site.
