    endpoint on the domain is the default WordPress core REST API at /wp-json/, whose
    nineteen namespaces are WP core plus off-the-shelf plugins (Wordfence, AIOSEO,
    Relevanssi, The Events Calendar, Redirection, Flywheel) with not one first-party
    namespace, so it is CMS scaffolding rather than a product API.
